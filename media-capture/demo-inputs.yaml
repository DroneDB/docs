# The demo data that `npm run reset-demo` (reset-demo.mjs) puts back before each capture: the
# organization of the demo account, its datasets and their files, and the account settings.
# Every dataset of the organization is deleted and created again from this list, so each capture
# starts from the same state. Shot files say in their header comments what they need; add it here.
#
# A file comes from one of:
#   from: <org>/<dataset>/<path>   a file of a public showcase dataset on the source Hub (--source,
#                                  default the Hub that is reset: the local mirror and
#                                  hub.dronedb.app have the same datasets under the same slugs).
#                                  `*`, `?` and `[...]` in the file name take every match; `dest` is a
#                                  folder (ends with /). Downloads are cached in
#                                  $DDB_DOCS_HOME/demo-inputs-cache.
#   file: <path>                   a local file under the demo inputs root (DDB_DOCS_INPUTS, default
#                                  /mnt/data/datasets), or an absolute path
#   text: <content>                a small text file written by the script
#   zip: [ <entries> ]             a ZIP made by the script; each entry is a from/file/text source
#                                  with `as`, its path in the archive (a folder for a glob)
#   copy: <org>/<dataset>/<path>   a file of a public dataset of the Hub that is reset, copied on
#                                  the server (Copy to another dataset, as the demo account): nothing
#                                  is downloaded or uploaded and its build comes along, so it is not
#                                  built again. For large files. Globs as with `from`.
# `bytes: N` with from or file keeps only the first N bytes (a damaged file).
#
# A dataset can have `meta:` entries ({ key, data }), added as list items of its metadata after its
# files (saved views, reports); a string "{{hash:<path>}}" in the data is the hash of that file. The
# organization can have a `logo` (a from/file source) and `reportSettings` (its report templates, its
# annotation schema and `logos`: a source for each template that has a logo of its own).
# Input files are never committed to the docs repository.

org:
  slug: acme-surveys
  name: Acme Surveys
  description: Demo organization of the documentation
  # The logo of the organization (the report templates without a logo of their own show it)
  logo:
    file: docs-generated/report-demo/acme-logo.png
  # The report settings of the organization: its templates and its annotation schema (the report shots)
  reportSettings:
    templates:
      - id: site-inspection
        name: Site inspection
        primary: "#0f2a4a"
        accent: "#0891b2"
        paper: A4
        orientation: portrait
        headerText: Site inspection report
        footerText: Acme Surveys · Field services
        disclaimer: "Measurements come from an orthophoto and a point cloud processed without ground control: absolute positions are within a few metres, relative lengths within a few centimetres per metre."
        defaultSections: [cover, summary, overview, tables, items, notes]
      - id: punch-list
        name: Punch list (landscape)
        primary: "#7f1d1d"
        accent: "#64748b"
        paper: A4
        orientation: landscape
        headerText: Open items
        footerText: Acme Surveys · Issued for action
        disclaimer: ""
        defaultSections: [cover, summary, tables, notes]
    schema:
      categories:
        - { id: defect, name: Defect, colour: "#dc2626" }
        - { id: safety, name: Safety, colour: "#eab308" }
        - { id: environment, name: Environment, colour: "#16a34a" }
        - { id: asset, name: Asset, colour: "#0070e0" }
        - { id: observation, name: Observation, colour: "#64748b" }
      severities:
        - { id: low, name: Low, colour: "#16a34a" }
        - { id: medium, name: Medium, colour: "#eab308" }
        - { id: high, name: High, colour: "#dc2626" }
        - { id: critical, name: Critical, colour: "#7f1d1d" }
      statuses:
        - { id: open, name: Open, closed: false }
        - { id: in-progress, name: In progress, closed: false }
        - { id: monitoring, name: Monitoring, closed: false }
        - { id: resolved, name: Resolved, closed: true }
        - { id: no-action, name: No action needed, closed: true }
    logos: {}

account:
  # The Preferences of the demo account go back to the Hub defaults (every section deleted)
  resetPreferences: true
  # User metadata, set with the administrator account when DDB_DOCS_ADMIN_USER is available
  # (the Account page and Storage Info show a used / total bar)
  meta:
    maxStorageMB: 10240

datasets:
  # Get started: the dataset "just created" and the target of the upload shots
  - slug: getting-started
    name: Getting started
    visibility: private
    files: []

  # Get started: the first map; the share shots make it Unlisted, the reset makes it Private again
  - slug: first-map
    name: First map
    visibility: private
    files:
      - dest: odm_orthophoto/odm_orthophoto.tif
        from: odm/brighton-beach/odm_orthophoto/odm_orthophoto.tif

  # Files and Datasets pages
  - slug: site-a
    name: Site A
    visibility: private
    files:
      # Written here: the README of odm/aukerman is a single image that is not in the dataset
      - dest: README.md
        text: "# Site A\n\nMonthly drone survey of Site A.\n\n## Contents\n\n- `DJI_0001.JPG` … `DJI_0003.JPG`: the photos of the October flight\n- `ortho.tif`: the orthophoto, with its measurements\n- `products/`: the deliverables for the client\n\nContact the survey team before you delete or move a file.\n"
      - dest: options.json
        from: odm/zoo/options.json
      - dest: ortho.tif
        from: odm/brighton-beach/odm_orthophoto/odm_orthophoto.tif
      - dest: ortho_measurements.geojson
        from: odm/brighton-beach/odm_orthophoto/odm_orthophoto_measurements.geojson
      - dest: notes-old.txt
        text: "Notes of the first survey of Site A. Replaced by the notes of the second survey.\n"
      - dest: products/ortho.tif
        from: odm/brighton-beach/odm_orthophoto/odm_orthophoto.tif
      - dest: DJI_0001.JPG
        from: odm/brighton-beach/images/DJI_0018.JPG
      - dest: DJI_0002.JPG
        from: odm/brighton-beach/images/DJI_0019.JPG
      - dest: DJI_0003.JPG
        from: odm/brighton-beach/images/DJI_0020.JPG
      # A ZIP of at most 20 MB (here about 14 MB) with files in a subfolder
      - dest: survey-archive.zip
        zip:
          - as: photos/
            from: odm/brighton-beach/images/DJI_002[0-3].JPG
          - as: README.md
            from: odm/brighton-beach/README.md
      # The CAD drawing without a coordinate system (Autodesk sample: licence to confirm before a
      # production capture)
      - dest: civil_example-imperial.dwg
        file: vectors/dwg/civil_example-imperial.dwg

  - slug: old-survey
    name: Old survey
    visibility: private
    files:
      - dest: notes.txt
        text: "Old survey notes.\n"

  # Measure and Analyse pages: two orthophotos to measure and compare
  - slug: sheffield-park
    name: Sheffield Park
    visibility: private
    files:
      - dest: park-1.tif
        from: odm/sheffield-park-1/odm_orthophoto/odm_orthophoto.tif
      - dest: park-2.tif
        from: odm/sheffield-park-2/odm_orthophoto/odm_orthophoto.tif

  # Measure a splat: a copy of Willa Global Poland.ply (3.4 GB, built) with its camera views and
  # orientation (its _cameras.json has no pins, scale or measurements), copied on the server
  - slug: splats
    name: Splats
    visibility: private
    files:
      - dest: Willa Global Poland.ply
        copy: odx/splats/Willa Global Poland.ply
      - dest: Willa Global Poland_cameras.json
        copy: odx/splats/Willa Global Poland_cameras.json

  # Processing: builds that complete, wait for a file and fail
  - slug: builds
    name: Builds
    visibility: private
    files:
      - dest: orthophoto.tif
        from: odm/brighton-beach/odm_orthophoto/odm_orthophoto.tif
      # An OBJ without its material file (it names odm_textured_model_geo.mtl): "Waiting for files"
      - dest: house.obj
        from: odm/brighton-beach/odm_texturing/odm_textured_model_geo.obj
      # A LAZ cut after 300 KB: its header indexes, its build fails (a file that is not a LAZ at
      # all is refused by the upload)
      - dest: broken.laz
        from: odm/brighton-beach/odm_georeferencing/odm_georeferenced_model.laz
        bytes: 300000

  # Processing: the 18 images of Brighton Beach for photogrammetry
  - slug: photogrammetry
    name: Photogrammetry
    visibility: private
    files:
      - dest: images/
        from: odm/brighton-beach/images/*.JPG

  # Processing: the five bands of one MicaSense capture
  - slug: multispectral
    name: Multispectral
    visibility: private
    files:
      - dest: bands/
        from: odx/micasense/images/IMG_0180_?.tif

  # Processing: align a raster to a reference
  - slug: align
    name: Align
    visibility: private
    files:
      - dest: orthos/sheffield-park-1.tif
        from: odm/sheffield-park-1/odm_orthophoto/odm_orthophoto.tif
      - dest: orthos/sheffield-park-2.tif
        from: odm/sheffield-park-2/odm_orthophoto/odm_orthophoto.tif

  # Processing: Mask borders needs an orthophoto with a black border made of real pixels (no alpha,
  # no no-data value): the Brighton Beach orthophoto with its alpha band removed, and its masked
  # copy (`ddb mask`, the file the tool writes) for the before/after shot. Made by
  # local/generate-data.sh mask-borders (BSD 2-Clause, as odm/brighton-beach; README.md says so).
  - slug: mask-borders
    name: Mask borders
    visibility: private
    files:
      - dest: ortho-black-border.tif
        file: docs-generated/mask-borders/ortho-black-border.tif
      - dest: ortho-black-border_masked.tif
        file: docs-generated/mask-borders/ortho-black-border_masked.tif
      - dest: README.md
        file: docs-generated/mask-borders/README.md

  # Sharing pages and the dataset download shot (the visibility shots never change it)
  - slug: share-demo
    name: Share demo
    visibility: private
    files:
      - dest: orthophoto.tif
        from: odm/brighton-beach/odm_orthophoto/odm_orthophoto.tif

  # Reports: the "Beach inspection" of Brighton Beach, with annotations on the map (A) and on the point
  # cloud (B), their photos and 3D captures, a saved view and the report. The measurement files and the
  # pictures were made on a local Registry (2D items drawn on the orthophoto, 3D items captured in the
  # point cloud viewer) and are kept in docs-generated/report-demo (BSD 2-Clause, as odm/brighton-beach).
  # The images are copied on the server: the Photos tab finds them by their footprints.
  - slug: report-demo
    name: Report demo
    visibility: private
    files:
      - dest: odm_orthophoto/odm_orthophoto.tif
        copy: odm/brighton-beach/odm_orthophoto/odm_orthophoto.tif
      - dest: odm_georeferencing/odm_georeferenced_model.laz
        copy: odm/brighton-beach/odm_georeferencing/odm_georeferenced_model.laz
      - dest: images/
        copy: odm/brighton-beach/images/DJI_*.JPG
      - dest: odm_orthophoto/odm_orthophoto_measurements.geojson
        file: docs-generated/report-demo/odm_orthophoto/odm_orthophoto_measurements.geojson
      - dest: odm_georeferencing/odm_georeferenced_model_measurements.geojson
        file: docs-generated/report-demo/odm_georeferencing/odm_georeferenced_model_measurements.geojson
      - dest: odm_orthophoto/annotations/409e881b-f482-4053-8de8-e7dacf41458f-1.jpg
        file: docs-generated/report-demo/odm_orthophoto/annotations/409e881b-f482-4053-8de8-e7dacf41458f-1.jpg
      - dest: odm_orthophoto/annotations/84176915-1992-47e4-9ec5-16a276b7e6ab-1.jpg
        file: docs-generated/report-demo/odm_orthophoto/annotations/84176915-1992-47e4-9ec5-16a276b7e6ab-1.jpg
      - dest: odm_georeferencing/annotations/2ee2c269-d639-4c2b-8883-e75edb9aac6f-3d.webp
        file: docs-generated/report-demo/odm_georeferencing/annotations/2ee2c269-d639-4c2b-8883-e75edb9aac6f-3d.webp
      - dest: odm_georeferencing/annotations/83f19f83-7a81-44d9-93a9-388d364a9d8d-3d.webp
        file: docs-generated/report-demo/odm_georeferencing/annotations/83f19f83-7a81-44d9-93a9-388d364a9d8d-3d.webp
      - dest: odm_georeferencing/annotations/e21b4702-ee83-4e74-b2a8-15e64389f113-3d.webp
        file: docs-generated/report-demo/odm_georeferencing/annotations/e21b4702-ee83-4e74-b2a8-15e64389f113-3d.webp
    meta:
      - key: views
        data:
          uid: v_beach001
          name: "Beach: orthophoto"
          v: 1
          base: { path: odm_orthophoto/odm_orthophoto.tif, hash: "{{hash:odm_orthophoto/odm_orthophoto.tif}}" }
          layers:
            - { path: odm_orthophoto/odm_orthophoto.tif, hash: "{{hash:odm_orthophoto/odm_orthophoto.tif}}", opacity: 1, visible: true, vizParams: null }
          split: { enabled: false, positions: [] }
          view: null
          display: { basemap: null }
          analysis: { target: null }
          createdAt: "2026-06-18T09:00:00.000Z"
          createdBy: demo
          updatedAt: "2026-06-18T09:00:00.000Z"
          updatedBy: demo
      - key: reports
        data:
          uid: r_beach001
          version: 1
          name: Beach inspection
          templateId: site-inspection
          title: Beach inspection
          subtitle: Brighton Beach park · June 2026
          preparedBy: J. Doe, Acme Surveys
          preparedFor: Parks department (sample client)
          notes: "Inspection from the drone flight of 18 June 2026 and a walk-over the same day.\n\n- **Priority:** the dead limb over the park road (A-8).\n- The gazebo roof is booked with the facilities team (A-2).\n- 3D items (source B) come from the point cloud; their pictures were captured in the 3D viewer."
          sources:
            - { file: odm_orthophoto/odm_orthophoto_measurements.geojson, label: A }
            - { file: odm_georeferencing/odm_georeferenced_model_measurements.geojson, label: B }
          filter: { groups: [], categories: [], severities: [], statuses: [], kinds: [], owners: [] }
          cover: { viewId: v_beach001 }
          sections:
            - { kind: cover, enabled: true }
            - { kind: summary, enabled: true }
            - { kind: overview, enabled: true }
            - { kind: tables, enabled: true }
            - { kind: items, enabled: true }
            - { kind: notes, enabled: true }
          units: null
          createdBy: demo
          createdAt: "2026-06-18T10:00:00.000Z"
          modifiedAt: "2026-06-18T10:00:00.000Z"
