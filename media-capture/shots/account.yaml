# ---- Build notifications ------------------------------------------------------------------------------------

- id: account/build-notifications--setting
  type: screenshot
  alt: The Notifications tab with Send build notifications open
  page: hub-guide/account/build-notifications
  url: /r?preferences=notifications
  base: local
  auth: demo
  waitFor:
    selector: "#preferencesDialog"
    networkIdle: true
  actions:
    # the tab list scrolled to its end: opened by the link, it can stop with the tab under the Next button
    - scroll: { selector: "role=tab[name='Lists']", x: 800 }
    - click: "[aria-labelledby='pref-build-notifications-label']"
    - wait: "role=option[name='Failed or waiting for files']"
  highlight: "div:has(> [aria-labelledby='pref-build-notifications-label'])"   # the whole select, with its arrow
  crop: "#preferencesDialog"
  blocked: null

- id: account/build-notifications--email
  type: screenshot
  alt: A build notification e-mail with a failed, a waiting and a completed build
  page: hub-guide/account/build-notifications
  url: http://localhost:5181/         # MailHog web UI of the local Registry (see the top of this file)
  base: local
  auth: none
  waitFor:
    selector: "text=\"docsdemo\""                 # the list names the recipient, not the address
    networkIdle: true
  actions:
    - click: "text=\"docsdemo\" >> nth=0"         # the newest message to docsdemo
    - wait: 1500
  highlight: null
  crop: { x: 250, y: 100, width: 1190, height: 800 }   # the message (headers and HTML), not the MailHog side bar
  blocked: null

