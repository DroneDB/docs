# ---- Build notifications ------------------------------------------------------------------------------------

- id: account/build-notifications--setting
  type: screenshot
  alt: The Notifications tab with Send build notifications open
  page: hub-guide/account/build-notifications
  url: /r?preferences=notifications
  base: local
  auth: demo
  waitFor:
    selector: "#preferencesDialog"
    networkIdle: true
  actions:
    - click: "[aria-labelledby='pref-build-notifications-label']"
    - wait: "role=option[name='Failed or waiting for files']"
  highlight: "[aria-labelledby='pref-build-notifications-label']"
  crop: "#preferencesDialog"
  blocked: null

- id: account/build-notifications--email
  type: screenshot
  alt: A build notification e-mail with a failed, a waiting and a completed build
  page: hub-guide/account/build-notifications
  url: http://localhost:5181/         # MailHog web UI of the local Registry (see the top of this file)
  base: local
  auth: none
  waitFor:
    selector: "text=docsdemo@example.com"
    networkIdle: true
  actions:
    - click: "text=docsdemo@example.com >> nth=0"   # the newest message
    - wait: 1500
  highlight: null
  crop: null
  blocked: null

# ---- Plans & limits -----------------------------------------------------------------------------------------

- id: account/plans--storage-info
  type: screenshot
  alt: The Storage Info window with the total, used and free space
  page: hub-guide/account/plans
  url: /r
  base: hub
  auth: demo
  waitFor:
    selector: "[aria-controls='user_menu']"
    networkIdle: true
  actions:
