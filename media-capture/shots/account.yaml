# Shots of the Hub guide → Organizations & account pages (docs/hub-guide/account/*.mdx).
#
# Demo inputs that reset-demo.mjs must create or set:
#   - the account docsdemo with its e-mail address (docsdemo@example.com) and a storage quota of 10 GB (user
#     metadata maxStorageMB 10240, in demo-inputs.yaml) so the Account page and Storage Info show a used / total bar;
#   - the Preferences of docsdemo reset to the defaults before each run (the shots open the window as it is);
#   - acme-surveys/share-demo (see sharing.yaml) for the dataset download shot.
#
# Build notification shots use the local Registry with MailHog (media-capture/local/start.sh): Smtp points at
# MailHog, so the Notifications tab is there. The e-mail shot needs one finished digest in MailHog: before it,
# set docsdemo's "Send build notifications" to All, upload a file to a dataset of docsdemo on the local
# Registry, and wait for the digest (BuildNotifications.DigestMinutes: 1 minute on the local Registry).
# The MailHog web UI is http://localhost:5181 (DDB_DOCS_MAIL_PORT), not a Registry page: the runner must accept
# an absolute `url`.

# ---- Account ------------------------------------------------------------------------------------------------

- id: account/account--page
  type: screenshot
  alt: The Account page with the user information, the storage and the upload diagnostics
  page: hub-guide/account/account
  url: /account
  base: hub
  auth: demo
  waitFor:
    selector: "text=User Information"
    networkIdle: true
  actions: []
  highlight: null
  crop: null
  blocked: null

- id: account/account--upload-diagnostics
  type: screenshot
  alt: The Upload diagnostics card after a test, with the protocol, round trip and speeds
  page: hub-guide/account/account
  url: /account#upload-diagnostics
  base: hub
  auth: demo
  waitFor:
    selector: "#upload-diagnostics"
    networkIdle: true
  actions:
    - click: "role=button[name='Run test']"
    - wait: "text=Six uploads at once"
  highlight: "role=button[name='Run again']"
  crop: "#upload-diagnostics"
  blocked: null

- id: account/account--change-password
  type: screenshot
  alt: The Change Password window with the password rules
  page: hub-guide/account/account
  url: /account
  base: hub
  auth: demo
  waitFor:
    selector: "text=User Information"
    networkIdle: true
  actions:
    - click: "role=button[name='Change Password']"
    - wait: "#changePwdDialog"
    - fill: { selector: "#change-pwd-dialog-new-password", value: "Example1" }   # shows the rules; never confirm
  highlight: null
  crop: "#changePwdDialog"
  blocked: null

