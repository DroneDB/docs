# Shots of the Hub guide → Sharing & integration pages (docs/hub-guide/sharing/*.mdx).
#
# Demo inputs that reset-demo.mjs must create in the organization acme-surveys (private, owner docsdemo):
#   share-demo      (dataset, visibility PRIVATE)  orthophoto.tif   a copy of odm/brighton-beach
#                                                                   odm_orthophoto/odm_orthophoto.tif (built)
#   The visibility shots must never click "Make Unlisted" (the confirmation) or change the visibility:
#   reset-demo.mjs sets share-demo back to PRIVATE before each run anyway.
#
# The QGIS shots marked `desktop: qgis` show the QGIS desktop program, not a Hub page: the Playwright runner
# cannot take them. They are recorded by hand (the clip matches marketing clip C23) with the QGIS URL that
# sharing/qgis--share-dialog shows.
#
# Right-click: `click: { selector, button: right }` opens the context menu of the file browser.

# ---- Visibility ---------------------------------------------------------------------------------------------

- id: sharing/visibility--settings
  type: screenshot
  alt: The Dataset Settings window with the Visibility list open
  page: hub-guide/sharing/visibility
  url: /r/acme-surveys/share-demo
  base: hub
  auth: demo
  waitFor:
    selector: "[aria-label='Settings']"
    networkIdle: true
  actions:
    - click: "[aria-label='Settings']"
    - wait: "#settings"
    - click: "[aria-labelledby='settings-visibility-label']"
    - wait: "role=option[name='Unlisted']"
  highlight: "div:has(> [aria-labelledby='settings-visibility-label'])"   # the whole list, arrow included
  crop: "#settings"
  blocked: null

- id: sharing/visibility--make-unlisted
  type: screenshot
  alt: The Share window of a file in a private dataset, which says the dataset is Private and offers Make the dataset Unlisted...
  page: hub-guide/sharing/visibility
  url: /r/acme-surveys/share-demo
  base: hub
  auth: demo
  waitFor:
    selector: "[role='option']:has-text('orthophoto.tif')"
    networkIdle: true
  actions:
    - rightClick: "[role='option']:has-text('orthophoto.tif')"
    - click: "role=menuitem[name='Share/Embed']"
    - wait: "role=button[name='Make the dataset Unlisted...']"
  highlight: "role=button[name='Make the dataset Unlisted...']"
  crop: "#share-embed"
  blocked: null

- id: sharing/visibility--make-unlisted-confirm
  type: screenshot
  alt: The question before a private dataset becomes Unlisted, which names the dataset and says that anyone with a link can open every file in it
  page: hub-guide/sharing/visibility
  url: /r/acme-surveys/share-demo
  base: hub
  auth: demo
  waitFor:
    selector: "[role='option']:has-text('orthophoto.tif')"
    networkIdle: true
  actions:
    - rightClick: "[role='option']:has-text('orthophoto.tif')"
    - click: "role=menuitem[name='Share/Embed']"
    - click: "role=button[name='Make the dataset Unlisted...']"   # opens the question only
    - wait: "role=button[name='Make Unlisted']"                    # do NOT click it
  highlight: null
  crop: "#confirmDialog"
  blocked: null

