  auth: none
  waitFor:
    selector: "body"
    networkIdle: true
  actions:
    - mouse: { click: [151, 9] }         # the pretty-print box of the browser's JSON viewer (closed shadow DOM, label in the browser's language)
    - wait: 500
  highlight: null
  crop: { x: 0, y: 26, width: 900, height: 560 }    # the start of the JSON, without the pretty-print box
  blocked: null
