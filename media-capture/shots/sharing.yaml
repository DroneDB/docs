# Shots of the Hub guide → Sharing & integration pages (docs/hub-guide/sharing/*.mdx).
#
# Demo inputs that reset-demo.mjs must create in the organization acme-surveys (private, owner docs-demo):
#   share-demo      (dataset, visibility PRIVATE)  orthophoto.tif   a copy of odm/brighton-beach
#                                                                   odm_orthophoto/odm_orthophoto.tif (built)
#   The visibility shots must never click "Allow access to anyone with the link" or change the visibility:
#   reset-demo.mjs sets share-demo back to PRIVATE before each run anyway.
#
# The QGIS shots marked `desktop: qgis` show the QGIS desktop program, not a Hub page: the Playwright runner
# cannot take them. They are recorded by hand (the clip matches marketing clip C23) with the QGIS URL that
# sharing/qgis--share-dialog shows.
#
# Right-click: `click: { selector, button: right }` opens the context menu of the file browser.

# ---- Visibility ---------------------------------------------------------------------------------------------

- id: sharing/visibility--settings
  type: screenshot
  alt: The Dataset Settings window with the Visibility list open
  page: hub-guide/sharing/visibility
  url: /r/acme-surveys/share-demo
  base: hub
  auth: demo
  waitFor:
    selector: "[title='Settings']"
    networkIdle: true
  actions:
    - click: "[title='Settings']"
    - wait: "#settings"
    - click: "[aria-labelledby='settings-visibility-label']"
    - wait: "role=option[name='Unlisted']"
  highlight: "[aria-labelledby='settings-visibility-label']"
  crop: "#settings"
  blocked: null

- id: sharing/visibility--allow-access
  type: screenshot
  alt: The Share window of a file in a private dataset, with Allow access to anyone with the link
  page: hub-guide/sharing/visibility
  url: /r/acme-surveys/share-demo
  base: hub
  auth: demo
  waitFor:
    selector: "text=orthophoto.tif"
    networkIdle: true
  actions:
    - click: { selector: "text=orthophoto.tif", button: right }
    - click: "role=menuitem[name='Share/Embed']"
    - wait: "role=button[name='Allow access to anyone with the link']"   # do NOT click it
  highlight: "role=button[name='Allow access to anyone with the link']"
  crop: "#share-embed"
  blocked: null

# ---- Share links & embeds -----------------------------------------------------------------------------------

- id: sharing/links-embeds--copy-iframe
  type: clip
  alt: Copy the embed code of an orthophoto and paste it into a web page
  page: hub-guide/sharing/links-embeds
  url: /r/odm/brighton-beach
  base: hub
  auth: none
  waitFor:
    selector: "text=odm_orthophoto"
    networkIdle: true
  actions:
    - click: "text=odm_orthophoto"
    - wait: "text=odm_orthophoto.tif"
    - click: { selector: "text=odm_orthophoto.tif", button: right }
    - click: "role=menuitem[name='Share/Embed']"
    - click: "#share-mode"
    - click: "role=option[name='Embed']"
    - click: "[aria-label='Embed code']"
    - wait: 1500
    # second half: a local test page (media-capture/fixtures/embed.html, to be added) with the copied
    # iframe pasted in, loading the map
  highlight: "[aria-label='Embed code']"
  maxSeconds: 30
  blocked: null
  youtubeId: null

