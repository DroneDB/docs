- id: sharing/stac--collection
  type: screenshot
  alt: The STAC collection of odm/brighton-beach as JSON
  page: hub-guide/sharing/stac
  url: /stac/collections/odm/brighton-beach   # one public collection: the root catalog lists other users' datasets
