# ---- Stockpile volume -----------------------------------------------------------------------

- id: analyse/stockpile--detect-material
  type: clip
  alt: A pile detected on a DSM with a click, then a material selected for its weight and cost
  page: hub-guide/analyse/stockpile
  open: { org: odm, ds: caliterra, path: odm_dem/dsm.tif, view: map }
  base: hub
  auth: none
  waitFor: { selector: "[aria-label='Map'] canvas", networkIdle: true, extraMs: 1500 }
  actions:
    # The sand pile next to the culverts (30.170892, -98.090734) is at (821, 741) in the default
    # view of the clip (1920×1200): three double clicks there zoom in 8 times around it, and it is
    # then at (823, 751)
    - mouse: { dblclick: [821, 741] }
    - wait: 1200
    - mouse: { dblclick: [821, 741] }
    - wait: 1200
    - mouse: { dblclick: [821, 741] }
    - wait: 2000
    - click: "[aria-label='Stockpile Volume']"
    - wait: 1500
    - click: "button[title='Click on the map to detect a pile at that point']"
    - wait: 1000                                # a map click right after the button is not taken as a detection
    - mouse: { click: [823, 751] }              # the sand pile: about 6.8 m³ and 15 m², on a Best-fit plane
    - wait: "text=Net volume"
    - select: { selector: "#stockpile-volume-panel-material", value: gravel }
    - wait: 1500
  highlight: null
  crop: null
  maxSeconds: 25
  blocked: null
  youtubeId: null

