# Shots of the Analyse rasters pages (docs/hub-guide/analyse/).
#
# Demo inputs (reset-demo.mjs) for the shots with `auth: demo`, in the org acme-surveys:
# - dataset `sheffield-park` (shared with measure.yaml): the orthophotos of odm/sheffield-park-1
#   and odm/sheffield-park-2 as `park-1.tif` and `park-2.tif`, built.
# - the clip analyse/compare-view--compare-to-add-save saves the comparison "Park 1 and 2" of
#   park-1.tif and park-2.tif (the dataset meta list `comparisons`); the saved-list shot shows it,
#   so capture the two together, the clip first (--only analyse/compare-view).
#
# Public data: odx/micasense (6-band orthophoto and odm_dem/dsm.tif), odx/hat-creek (two thermal
# mosaics of 24 and 25 August 2018 at the root of the dataset), odm/caliterra (odm_dem/dsm.tif, a
# local-only DSM made by media-capture/local/generate-data.sh). The stockpile shots measure the sand
# pile next to the culverts (the debris pile near the excavator is on interpolated DSM and cannot
# be detected; Detect all does not find the sand pile). A click on it detects it on its slope and
# opens it on Best-fit plane; the draw shot draws a polygon around the same pile.
#
# The compare URLs use base64url of the paths (no padding):
#   08242018 mosaic: QWlyYm9ybmVfdGhlcm1hbF9pbmZyYXJlZF9tb3NhaWNfSGF0X0NyZWVrX0NhbGlmb3JuaWFfMDgyNDIwMThfMTZiaXQudGlm
#   08252018 mosaic: QWlyYm9ybmVfdGhlcm1hbF9pbmZyYXJlZF9tb3NhaWNfSGF0X0NyZWVrX0NhbGlmb3JuaWFfMDgyNTIwMThfMTZiaXQudGlm

