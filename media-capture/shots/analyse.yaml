# ---- Compare view ---------------------------------------------------------------------------

- id: analyse/compare-view--compare-to-add-save
  type: clip
  alt: A second orthophoto added to the compare view, the divider dragged, the comparison saved
  page: hub-guide/analyse/compare-view
  # Compare to... opens the compare view in a new tab, which a clip cannot follow: the clip starts
  # where that tab starts, on park-1.tif with the Add raster to compare dialog open (pick=1)
  url: /r/acme-surveys/sheffield-park/compare?p=cGFyay0xLnRpZg&pick=1
  base: hub
  auth: demo
  waitFor: { selector: "text=Add raster to compare", networkIdle: true, extraMs: 1500 }
  actions:
    - click: "[role='dialog'] >> text=park-2.tif"
    - click: "[role='dialog'] >> text=Confirm"
    - wait: 2500
    - drag: { from: [960, 700], to: [700, 700] }   # the divider (1920x1200 clip viewport)
    - wait: 1000
    - click: "role=button[name='Save']"
    - fill: { selector: "[role='dialog'] input", value: Park 1 and 2 }
    - press: Enter
    - wait: 1500
  highlight: null
  crop: null
  maxSeconds: 30
  blocked: null
  youtubeId: null

