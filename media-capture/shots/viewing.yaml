# Shots of the Hub guide pages under docs/hub-guide/viewing/.
#
# Demo inputs (acme-surveys): none. Every shot here is read-only and uses the public odm/odx
# datasets with auth none, except the training-data export dialog, which uses auth demo only
# because the export is a task (it opens the dialog on the public odm/brighton-beach and does not
# start the export).
#
# Notes for the capture pass:
# - The file list opens a folder or a file with Enter on a focused tile (EntryThumbnail), so
#   "click the tile, press Enter" stands for a double click.
# - The splat viewer is set to Quality High in each shot (README rule). It starts a tour of the
#   camera views on open, so each splat shot presses the number of a camera view: the flight to it
#   stops the tour, and the shot shows that view (Willa Global Poland.ply: 1 the entrance with the
#   sign, 2 the side with the outside stairs, 3 the garden side).
# - blocked: data = the showcase data is missing: 3D Tiles (.3tz), video / geo-video,
#   geo-panorama, georeferenced splat.

# ---------------------------------------------------------------- map
- id: viewing/map--zoom-opacity
  type: clip
  alt: Zooming into the odm/zoo orthophoto and dragging the opacity slider
  page: hub-guide/viewing/map
  open: { org: odm, ds: zoo, path: odm_orthophoto/odm_orthophoto.tif, view: map }
  base: hub
  auth: none
  waitFor: { selector: "[aria-label='Map'] canvas", networkIdle: true, extraMs: 2000 }
  actions:
    - wait: 1000
    - scroll: { selector: "[aria-label='Map'] canvas", y: -300 }   # zoom in at the centre (mouse wheel)
    - wait: 2500
    - drag: { selector: "[aria-label='Layer opacity']", from: [0.97, 0.5], to: [0.25, 0.5] }
    - wait: 1500
    - drag: { selector: "[aria-label='Layer opacity']", from: [0.25, 0.5], to: [0.8, 0.5] }
    - wait: 1500
  highlight: "[aria-label='Layer opacity']"
  maxSeconds: 20
  blocked: null
  youtubeId: null

