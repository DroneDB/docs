- id: viewing/markdown-pdf--pdf
  type: screenshot
  alt: The ODM report PDF of odm/brighton-beach in the PDF window
  page: hub-guide/viewing/markdown-pdf
  url: /r/odm/brighton-beach
  base: hub
  auth: none
  waitFor: { selector: 'text="odm_report"', networkIdle: true, extraMs: 1000 }
  actions:
    - click: 'text="odm_report"'
    - press: Enter
    - wait: 'text="report.pdf"'
    - click: 'text="report.pdf"'
    - press: Enter
    - wait: "#pdfViewerDialog iframe"
    - wait: 3000
  crop: "#pdfViewerDialog"
  blocked: null
