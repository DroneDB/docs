  crop: null
  blocked: null                      # bm3d viewer: capture after the model rebuild of the showcase data

- id: get-started/tour--share
  type: screenshot
  alt: The Share / Embed window of an orthophoto with its share link
  page: get-started/tour
  url: /r/odm/brighton-beach
  base: hub
  auth: none
  waitFor: { selector: "[role='tree'][aria-label='Folders']", networkIdle: true, extraMs: 1000 }
  actions:
    - click: "[role='option']:text-is('odm_orthophoto')"
    - press: Enter
    - wait: "[role='option']:has-text('odm_orthophoto.tif')"
    - click: "[role='option']:has-text('odm_orthophoto.tif')"
    - click: "[title='Share odm_orthophoto.tif']"   # the share button of the header
    - wait: "[aria-label='Share link']"
    - wait: 500
  highlight: "[aria-label='Share link']"
  crop: "[role='dialog']"
  blocked: null

