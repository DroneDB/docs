# ---- Upload your data ----

- id: get-started/upload--drag-drop
  type: clip
  alt: A folder dragged into a dataset, the upload progress and the files that appear
  page: get-started/upload
  url: /r/acme-surveys/getting-started
  base: hub
  auth: demo
  waitFor: { selector: "[role='tree'][aria-label='Folders']", networkIdle: true, extraMs: 1000 }
  actions:
    # needs capture action: drop the local folder brighton-beach/ on the file area
    # (dropFiles: { selector: "[role='tabpanel']", files: [brighton-beach/] })
    - wait: "text=Upload Progress"
    - wait: "text=Close"             # the upload is complete
    - click: "button:has-text('Close')"
    - wait: 4000
  highlight: null
  crop: null
  maxSeconds: 30
  blocked: null
  youtubeId: null

- id: get-started/upload--dialog
  type: screenshot
  alt: The Upload window with Select Files, Select Folder and Import from URL
  page: get-started/upload
  url: /r/acme-surveys/getting-started
  base: hub
  auth: demo
  waitFor: { selector: "[aria-label='Upload']", networkIdle: true, extraMs: 500 }
  actions:
    - click: "[aria-label='Upload']"
    - wait: "text=Select files to upload"
  highlight: "button:has-text('Select Folder')"
  crop: "[role='dialog']"
  blocked: null

- id: get-started/upload--progress
  type: screenshot
  alt: The Upload Progress window with the files, the speed and the time left
  page: get-started/upload
  url: /r/acme-surveys/getting-started
  base: hub
  auth: demo
  waitFor: { selector: "[aria-label='Upload']", networkIdle: true, extraMs: 500 }
  actions:
    - click: "[aria-label='Upload']"
    - wait: "text=Select Folder"
    # needs capture action: set the files of the folder input to the local folder brighton-beach/
    # (setFiles: { trigger: "button:has-text('Select Folder')", files: [brighton-beach/] })
    - wait: "text=In Progress"
    - wait: 1500                     # shoot while files are still uploading
  highlight: null
  crop: "[role='dialog']"
  blocked: null

- id: get-started/upload--building
  type: screenshot
  alt: Uploaded files in a dataset; the orthophoto shows a spinning icon while Hub builds it
  page: get-started/upload
  url: /r/acme-surveys/getting-started
  base: hub
  auth: demo
  waitFor: { selector: "[role='tree'][aria-label='Folders']", networkIdle: true, extraMs: 500 }
  actions:
    # Shoot right after upload--drag-drop, while the build of odm_orthophoto.tif runs
    - click: "[role='option']:text-is('odm_orthophoto')"
    - press: Enter
    - wait: "[role='option']:has-text('odm_orthophoto.tif') .fa-spin"
  highlight: "[role='option']:has-text('odm_orthophoto.tif')"
  crop: null
  blocked: null

