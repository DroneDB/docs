- id: get-started/tour--model
  type: screenshot
  alt: The textured 3D model of Brighton Beach in the 3D model viewer
  page: get-started/tour
  open:
    org: odm
    ds: brighton-beach
    path: odm_texturing/odm_textured_model_geo.obj
    view: model
  base: hub
