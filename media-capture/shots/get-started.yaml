# Shots of the Get started section (docs/get-started/*).
#
# Demo inputs that reset-demo.mjs must create (auth: demo, user docs-demo):
#   - Personal organization `docs-demo` (made with the user): no datasets, so "My Datasets"
#     shows the empty list with the Create Dataset button.
#   - acme-surveys/getting-started: private, empty (the dataset "just created" in first-dataset
#     and the target of the upload shots).
#   - acme-surveys/first-map: private, holds odm_orthophoto/odm_orthophoto.tif (8.5 MB, a copy
#     of odm/brighton-beach odm_orthophoto/odm_orthophoto.tif), built. The share shots set it to
#     Unlisted; the reset sets it back to Private.
# Local files the upload shots drop or pick (not in a dataset): a folder `brighton-beach/` with
#   images/DJI_0018.JPG … (the 18 photos of odm/brighton-beach images/) and
#   odm_orthophoto/odm_orthophoto.tif, so the upload shows photos and one file that builds.
#
# Upload shots need two actions that the format does not have yet (see the lines marked
# "needs capture action"): drop local files on an element, and set the files of a file input.

# ---- What is DroneDB Hub / 5-minute tour (odm/brighton-beach, no account) ----

- id: get-started/tour--overview
  type: clip
  alt: A tour of a public dataset on Hub, from the files to the map and the orthophoto
  page: get-started/index            # also the hero clip of the home page
  url: /r/odm/brighton-beach
  base: hub
  auth: none
  waitFor: { selector: "[role='tree'][aria-label='Folders']", networkIdle: true, extraMs: 1500 }
  actions:
    - wait: 1500
    - click: "[role='option']:has-text('brighton_beach.jpg')"
    - wait: 2000
    - click: "[role='tab']:has-text('Map')"
    - wait: 4000
    - mouse: { click: [720, 450] }   # a photo marker near the centre: its popup (adjust after the first run)
    - wait: 2500
    - click: "[role='tab']:has-text('Files')"
    - click: "[role='option']:text-is('odm_orthophoto')"
    - press: Enter                   # opens the folder (Enter = double-click on a tile)
    - wait: 1500
    - click: "[role='option']:has-text('odm_orthophoto.tif')"
    - press: Enter                   # opens the orthophoto on its map
    - wait: 5000
    - scroll: { selector: "canvas", y: -600 }   # zoom in (mouse wheel)
    - wait: 3000
  highlight: null
  crop: null
  maxSeconds: 32
  blocked: null
  youtubeId: null

- id: get-started/tour--files
  type: screenshot
  alt: The Files tab of a dataset with the folder tree, the files and the properties of a photo
  page: get-started/tour
  url: /r/odm/brighton-beach
  base: hub
  auth: none
  waitFor: { selector: "[role='tree'][aria-label='Folders']", networkIdle: true, extraMs: 1500 }
  actions:
    - click: "[role='option']:has-text('brighton_beach.jpg')"
    - wait: 1500
  highlight: "[role='option']:has-text('brighton_beach.jpg')"
  crop: null
  blocked: null

- id: get-started/tour--dataset-map
  type: screenshot
  alt: The Map tab of a dataset with the orthophoto and the positions of the drone photos
  page: get-started/tour
  url: /r/odm/brighton-beach
  base: hub
  auth: none
  waitFor: { selector: "[role='tree'][aria-label='Folders']", networkIdle: true, extraMs: 1000 }
  actions:
    - click: "[role='tab']:has-text('Map')"
    - wait: "canvas"
