# Shots of the Hub guide → Processing pages (docs/hub-guide/processing/*.mdx).
#
# Demo inputs that reset-demo.mjs must create in the organization acme-surveys (private, owner docsdemo):
#   builds          (dataset)  orthophoto.tif           a copy of odm/brighton-beach odm_orthophoto/odm_orthophoto.tif (built)
#                              house.obj                an OBJ uploaded WITHOUT its house.mtl (build "Waiting for files")
#                              broken.laz               a LAZ cut after 300 KB (build "Failed")
#   photogrammetry  (dataset)  images/*.JPG             the 18 images of odm/brighton-beach images/
#   multispectral   (dataset)  bands/IMG_0180_1.tif … bands/IMG_0180_5.tif
#                                                       the five band files of one capture of odx/micasense images/
#   align           (dataset)  orthos/sheffield-park-1.tif, orthos/sheffield-park-2.tif
#                                                       odm_orthophoto/odm_orthophoto.tif of odm/sheffield-park-1 and -2
#   mask-borders    (dataset)  ortho-black-border.tif, ortho-black-border_masked.tif
#                                                       the Brighton Beach orthophoto with a real black border and its
#                                                       masked copy (local/generate-data.sh mask-borders)
#
# The Photogrammetry shots need a processing node: the local Registry of media-capture/local has one (NodeODX
# `local`); without a node the "Run Photogrammetry" button is hidden. The clip starts a Fast Orthophoto run of the
# 18 images (about 2.5 minutes locally); capture processing/photogrammetry--progress right after it and
# processing/photogrammetry--results when the task has ended. It uses processing quota on a real node: capture it
# only when it changes. A running task shows a duration of 90 minutes or more: the page clock of the capture
# starts 90 minutes after the last demo reset.
#
# Folders are clicked in the tree ([aria-label='Folders']) and files by their tile ([role='option']:has-text(...)):
# the accessible names of the tiles and tabs start with their icon glyph. Context menu entries are menu items:
# select them by role and name.

# ---- Builds -------------------------------------------------------------------------------------------------

- id: processing/builds--badges
  type: screenshot
  alt: File browser with a failed build badge on broken.laz and a Waiting for files badge on house.obj
  page: hub-guide/processing/builds
  url: /r/acme-surveys/builds
  base: hub
  auth: demo
  waitFor:
    # the tile of a failed build shows its file icon as soon as its thumbnail does not load
    selector: "[role='option']:has-text('broken.laz') i.icon-file"   # the file icon; no name to select it by
    networkIdle: true
    extraMs: 1000
  actions: []                           # the reason of a badge is a browser tooltip (title): not in a screenshot
  highlight: null
  crop: { x: 0, y: 0, width: 1440, height: 360 }
  blocked: null

- id: processing/builds--details-panel
  type: screenshot
  alt: Details panel of an OBJ whose build waits for its .mtl file
  page: hub-guide/processing/builds
  url: /r/acme-surveys/builds
  base: hub
  auth: demo
  waitFor:
    selector: "text=house.obj"
    networkIdle: true
  actions:
    - click: "text=house.obj"           # file browser items have no aria-label: visible text
    - wait: "text=Waiting for files"
  highlight: "text=Waiting for files"
  crop: "[aria-label='File details']"
  blocked: null

- id: processing/builds--rebuild
  type: screenshot
  alt: The Rebuild File window with the Rebuild Anyway button
  page: hub-guide/processing/builds
  url: /r/acme-surveys/builds
  base: hub
  auth: demo
  waitFor:
    selector: "text=orthophoto.tif"
    networkIdle: true
  actions:
    - click: "text=orthophoto.tif"
    - click: "role=button[name='Build']"
    - wait: "role=dialog[name='Rebuild File']"
  highlight: "role=button[name='Rebuild Anyway']"
  crop: "role=dialog[name='Rebuild File']"
  blocked: null

- id: processing/builds--download-menu
  type: screenshot
  alt: The Tools menu of an orthophoto with Download COG
  page: hub-guide/processing/builds
  url: /r/odm/brighton-beach
  base: hub
  auth: none
  waitFor:
    selector: "[aria-label='Files'] [role='option']"
    networkIdle: true
  actions:
    - click: "[aria-label='Folders'] >> text=odm_orthophoto"
    - wait: 1500
    - rightClick: "[role='option']:has-text('odm_orthophoto.tif')"
    - hover: "role=menuitem[name='Tools']"
    - wait: "role=menuitem[name='Download COG']"
  highlight: "role=menuitem[name='Download COG']"
  crop: null
  blocked: null

# ---- Photogrammetry -----------------------------------------------------------------------------------------

- id: processing/photogrammetry--run
  type: clip
  alt: Start photogrammetry on the 18 images of a folder and follow the task in the Tasks tab
  page: hub-guide/processing/photogrammetry
  url: /r/acme-surveys/photogrammetry
  base: hub
  auth: demo
  waitFor:
    selector: "[role='tab']:has-text('Tasks')"
    networkIdle: true
  actions:
    - click: "[role='tab']:has-text('Tasks')"
    - click: "role=button[name='Run Photogrammetry']"
    - fill: { selector: "#task-history-image-folder", value: images }
    - click: "[aria-labelledby='task-history-processing-profile-label']"
    - click: "role=option[name='Fast Orthophoto']"
    - click: "role=button[name='Start']"
    - wait: "text=Photogrammetry (NodeODX)"
    - wait: 15000                        # the recording is trimmed by encode.sh; the run itself takes minutes
  highlight: "role=button[name='Run Photogrammetry']"
  maxSeconds: 40
  blocked: null
  youtubeId: null

- id: processing/photogrammetry--tasks-button
  type: screenshot
  alt: The Tasks tab of a dataset with the Run Photogrammetry button
  page: hub-guide/processing/photogrammetry
  url: /r/acme-surveys/photogrammetry
  base: hub
  auth: demo
  waitFor:
    selector: "[role='tab']:has-text('Tasks')"
    networkIdle: true
  actions:
    - click: "[role='tab']:has-text('Tasks')"
    - wait: "role=button[name='Run Photogrammetry']"
  highlight: "role=button[name='Run Photogrammetry']"
  crop: null
  blocked: null

- id: processing/photogrammetry--dialog
  type: screenshot
  alt: The Run Photogrammetry window with the processing profile list open
  page: hub-guide/processing/photogrammetry
  url: /r/acme-surveys/photogrammetry
  base: hub
  auth: demo
  waitFor:
    selector: "[role='tab']:has-text('Tasks')"
    networkIdle: true
  actions:
    - click: "[role='tab']:has-text('Tasks')"
    - click: "role=button[name='Run Photogrammetry']"
    - wait: "#photogrammetry"
    - fill: { selector: "#task-history-image-folder", value: images }
    - click: "[aria-labelledby='task-history-processing-profile-label']"
    - wait: "role=option[name='DSM + DTM (terrain)']"
  highlight: "div:has(> [aria-labelledby='task-history-processing-profile-label'])"   # the whole list, arrow included
  crop: "#photogrammetry"
  blocked: null

- id: processing/photogrammetry--progress
  type: screenshot
  alt: A running photogrammetry task with its progress bar in the Tasks tab
  page: hub-guide/processing/photogrammetry
  url: /r/acme-surveys/photogrammetry
  base: hub
  auth: demo
  waitFor:
    selector: "[role='tab']:has-text('Tasks')"
    networkIdle: true
    stable: false                              # the progress bar and the elapsed time move
  actions:
    - click: "[role='tab']:has-text('Tasks')"
    - wait: "role=progressbar"                 # the task that processing/photogrammetry--run started
  highlight: "role=progressbar"
  crop: null
  blocked: null

- id: processing/photogrammetry--results
  type: screenshot
  alt: The photogrammetry_output folder with the odm_orthophoto folder and the other results of a Fast Orthophoto run
  page: hub-guide/processing/photogrammetry
  url: /r/acme-surveys/photogrammetry
  base: hub
  auth: demo
  waitFor:
    selector: "[aria-label='Folders'] >> text=photogrammetry_output"   # after processing/photogrammetry--run has finished
    networkIdle: true
  actions:
    - click: "[aria-label='Folders'] >> text=photogrammetry_output"
    - wait: "[role='option']:has-text('odm_orthophoto')"
  highlight: null
  crop: { x: 0, y: 0, width: 1440, height: 600 }
  blocked: null

