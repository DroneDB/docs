# Shots of the Self-hosting section (docs/self-hosting/*).
#
# Every shot here uses the throwaway local Registry of media-capture/local/start.sh (base: local) and
# the default administrator (auth: admin): production admin pages show real users.
#
# Demo inputs (the users made by start.sh, the organization by `npm run reset-demo`):
#   - the users `docsdemo` and `docsmember` next to `admin`, so the second row of the Users table can
#     open the Delete User dialog (the button is disabled for `admin`);
#   - the organization `acme-surveys` (owner docsdemo), shown in the organizations dialogs.
# Nice to have for admin-pages--tasks: one finished task in acme-surveys (for example an
# archive-extract of a small ZIP), so the Tasks table is not empty.
#
# E-mail: start.sh turns SMTP on towards MailHog (web UI on DDB_DOCS_MAIL_PORT, default 5181).
# self-hosting/email--preview clicks "Send me a test", so run it before self-hosting/email--received,
# which opens the MailHog web UI by absolute URL (not a Hub path).
#
# Update check: start.sh sets AppSettings__UpdateCheckCron=disabled. The Usage and contact card then
# shows a note that the check is off, and the update icon never appears (update-check--notes is
# blocked until a local run with the check on and an older Registry version).

- id: self-hosting/admin-pages--menu
  type: screenshot
  alt: The user menu of an administrator with Manage Users, Tasks, Configuration, Hangfire and API Docs
  page: self-hosting/admin-pages
  url: /r
  base: local
  auth: admin
  waitFor: { selector: "[aria-controls='user_menu']", networkIdle: true, extraMs: 500 }
  actions:
    - click: "[aria-controls='user_menu']"
    - wait: "#user_menu"
  highlight: "text=Manage Users"
  crop: null
  blocked: null

- id: self-hosting/users--list
  type: screenshot
  alt: The User Management page with the users, their roles, organizations and storage
  page: self-hosting/users
  url: /admin/users
  base: local
  auth: admin
  waitFor: { selector: "[aria-label='Search users']", networkIdle: true, extraMs: 500 }
  actions: []
  highlight: null
  crop: null
  blocked: null

- id: self-hosting/users--add
  type: screenshot
  alt: The Add User dialog with user name, e-mail, password rules and roles
  page: self-hosting/users
  url: /admin/users
  base: local
  auth: admin
  waitFor: { selector: "[aria-label='Search users']", networkIdle: true, extraMs: 300 }
  actions:
    - click: "role=button[name='New User']"
    - wait: "#add-user-dialog-username"
    - fill: { selector: "#add-user-dialog-username", value: surveyor }
    - fill: { selector: "#add-user-dialog-email", value: surveyor@example.com }
    - fill: { selector: "#add-user-dialog-password", value: survey2026 }   # shows the rules of the password policy
  highlight: null
  crop: "#addUserDialog"
  blocked: null

- id: self-hosting/users--organizations
  type: screenshot
