  auth: admin
  waitFor: { selector: "[aria-label='Search users']", networkIdle: true, extraMs: 300 }
  actions:
    # the Organizations column button of the second row (docsdemo); the toolbar button has the same text but no title
    - click: "td [title='Manage Organizations'] >> nth=1"
    - wait: "text=User Organizations"
  highlight: null
  crop: null
  blocked: null

- id: self-hosting/users--roles
