  blocked: null

- id: self-hosting/users--delete
  type: screenshot
  alt: The Delete User dialog with the successor and the warning that all data will be deleted
  page: self-hosting/users
  url: /admin/users
  base: local
  auth: admin
  waitFor: { selector: "[aria-label='Search users']", networkIdle: true, extraMs: 300 }
  actions:
    # second row (docsdemo): the button of admin is disabled. The shot never confirms the dialog.
    - click: "[aria-label='Delete User'] >> nth=1"
    - wait: "#users-transfer-data-to-successor"
  highlight: null                    # the question sits right above the field: a box round the field covers it
  crop: "[role='dialog']"
  blocked: null

