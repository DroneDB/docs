- id: measure/splat--distance-height-pin
  type: clip
  alt: A distance and a height measured on a splat, then a pin added and saved
  page: hub-guide/measure/splat
  open: { org: acme-surveys, ds: splats, path: "Willa Global Poland.ply", view: splat }
  base: hub
  auth: demo
  waitFor: { selector: "[aria-label='Measure a distance']", networkIdle: true, extraMs: 4000 }
  actions:
    # the splat quality must be High (README): the pipeline sets the Quality preference before the run.
    # Camera view 2 (the side with the outside stairs) stops the tour that starts on open; the
    # clip is 1920x1200, so its points are those of the 1440x900 shots times 4/3
    - press: Digit2
    - wait: 2000
    - click: "[aria-label='Measure a distance']"
    - mouse: { click: [800, 693] }
    - mouse: { click: [1147, 693] }
    - press: Enter
    - click: "[aria-label='Measure a height']"
    - mouse: { click: [980, 560] }    # the downpipe: from the eaves to the ground
    - mouse: { click: [980, 990] }
    - wait: 800
    - click: "[aria-label='Pins']"
    - click: "text=Add a pin"
    - mouse: { click: [1240, 600] }   # the outside stairs
    - fill: { selector: "[aria-label='Name of pin 1']", value: Outside stairs }
    - fill: { selector: "textarea", value: "**Fire escape** from the upper floors." }
    - click: "text=Save"
    - wait: 1500
  highlight: null
  crop: null
  maxSeconds: 30
  blocked: null
  youtubeId: null

