# Shots of the Measure & annotate pages (docs/hub-guide/measure/).
#
# Demo inputs (reset-demo.mjs) for the shots with `auth: demo`, in the org acme-surveys:
# - dataset `sheffield-park`: the two orthophotos of odm/sheffield-park-1 and odm/sheffield-park-2
#   (odm_orthophoto/odm_orthophoto.tif of each) as `park-1.tif` and `park-2.tif`, built, with no
#   measurements file. The analyse shots use the same dataset.
# - dataset `splats`: a copy of odx/splats `Willa Global Poland.ply` (built) with its
#   `Willa Global Poland_cameras.json` (camera views and up axis; no pins, no scale, no
#   measurements), copied on the server.
#
# Map canvases: the coordinates of `mouse` actions are CSS pixels of the default 1440x900
# viewport, on the orthophoto as the map fits it on open. A later pass checks them on screen.
# OpenLayers ends a line when the last point is clicked again and a polygon when the first
# point is clicked again, so no double click is needed.

- id: measure/map--length-area-save
  type: clip
  alt: A length and an area measured on an orthophoto, then saved in the dataset
  page: hub-guide/measure/map
  open: { org: acme-surveys, ds: sheffield-park, path: park-1.tif, view: map }
  base: hub
  auth: demo
  waitFor: { selector: "[aria-label='Map'] canvas", networkIdle: true, extraMs: 1500 }
  actions:
    - click: "[aria-label='Measure Length']"
    - mouse: { click: [560, 420] }
    - mouse: { click: [760, 380] }
    - mouse: { click: [760, 380] }
    - wait: 800
    - click: "[aria-label='Measure Area']"
    - mouse: { click: [820, 480] }
    - mouse: { click: [960, 470] }
    - mouse: { click: [940, 600] }
    - mouse: { click: [820, 480] }
    - wait: 800
    - click: "[aria-label='Save Measurements']"
    - wait: 2000
  highlight: null
  crop: null
  maxSeconds: 25
  blocked: null
  youtubeId: null

