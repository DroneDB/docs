# Shots of the Hub guide pages under docs/hub-guide/files/ (the file browser and file actions).
#
# Read-only shots use odm/zoo (736 entries), odm/brighton-beach and odm/aukerman with auth: none.
# Demo inputs (reset-demo.mjs) for the shots with auth: demo, in the dataset acme-surveys/site-a:
#   - README.md: a copy of odm/aukerman README.md
#   - options.json: a copy of odm/zoo options.json (opens in the text editor, shows Format)
#   - ortho.tif: a small georeferenced GeoTIFF (for example a crop of the odm/brighton-beach
#     orthophoto), and ortho_measurements.geojson next to it (the sidecar of the rename shot)
#   - notes-old.txt: any small text file (the delete shot opens its confirmation only)
#   - products/ortho.tif: a second copy of ortho.tif in the folder products (the paste conflict)
#   - survey-archive.zip: a ZIP of up to 20 MB with a few files in a subfolder
#   - civil_example-imperial.dwg: the CAD drawing without a coordinate system (dataset gap: licence
#     to confirm, source /mnt/data/datasets/vectors/dwg/); its shots are blocked until it is added
#
# The Hub has no aria-label on the header Download and Settings buttons (title only).
# The capture format has no right-click action yet: the shots that need the context menu say so
# on the action that stands for the right-click.

- id: files/browser--views
  type: clip
  alt: The images folder of a dataset in the grid view, then the table view and the expanded table view
  page: hub-guide/files/browser
  url: /r/odm/zoo
  auth: none
  waitFor:
    selector: "[aria-label='Files'] [role='option']"
    networkIdle: true
  actions:
    - click: "[aria-label='Folders'] >> text=images"
    - wait: 2500
    - click: "[aria-label='Files'] [role='option'] >> nth=0"
    - wait: 1500
    - click: "[aria-label='Table View']"
    - wait: 1500
    - click: "[aria-label='Expanded Table View']"
    - wait: 1500
    - click: "[aria-label='Grid View']"
    - wait: 1500
  maxSeconds: 20
  blocked: null
  youtubeId: null

